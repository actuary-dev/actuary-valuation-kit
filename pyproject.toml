    "avk.products.unit_linked.formulas -> avk.products.unit_linked.gf_interest",
    "avk.products.unit_linked.expenses -> avk.model.lang",
    "avk.products.unit_linked.formulas -> avk.products.unit_linked.expenses",
    "avk.products.unit_linked.general_fund -> avk.model.lang",
    "avk.products.unit_linked.formulas -> avk.products.unit_linked.general_fund",
    "avk.products.unit_linked.reserves -> avk.model.lang",
    "avk.products.unit_linked.formulas -> avk.products.unit_linked.reserves",
    "avk.products.unit_linked.profit -> avk.model.lang",
