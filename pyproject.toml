[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[project]
name = "actuary-valuation-kit"
version = "0.1.0"
description = "Actuarial projection models compiled from formulas"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
dependencies = [
    "numpy==2.5.3",
    "numba==0.67.0",
    "polars==1.44.2",
    "pyarrow==25.0.1",
    "pyyaml>=6,<7",
    "pydantic==2.13.5",
]

[project.urls]
Repository = "https://github.com/actuary-dev/actuary-valuation-kit"

[project.scripts]
avk = "avk.cli:main"

[project.optional-dependencies]
gpu = ["numba-cuda-mlir[cu13]==0.5.3"]
ui = ["streamlit>=1.64,<2", "plotly>=7,<8", "psutil>=7,<8"]
sql = ["SQLAlchemy>=2.1,<2.2", "mysql-connector-python>=26.7,<27"]
mssql = ["pyodbc>=5,<6"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<2.4",
    "import-linter==2.15",
    "nbmake>=1.5,<2",
]

[tool.uv.build-backend]
module-name = "avk"
source-exclude = ["CLAUDE.md", "tests/saved/demo/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not slow and not perf and not gpu and not sql"'
markers = [
    "slow: public 100k product regressions",
    "perf: complete-run performance budgets",
    "gpu: manual NVIDIA GPU regressions",
    "sql: SQL integration regressions",
    "ui: Streamlit user flows",
    "purepython: complete runs with NUMBA_DISABLE_JIT=1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src/avk"]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["avk.products.*.formulas", "avk.products.unit_linked.fund_slots", "avk.products.unit_linked.decrements", "avk.products.unit_linked.lives", "avk.products.unit_linked.premiums", "avk.products.unit_linked.dpf", "avk.products.unit_linked.paid_up", "avk.products.unit_linked.benefits", "avk.products.unit_linked.gf_interest", "avk.products.unit_linked.expenses", "avk.products.unit_linked.general_fund", "avk.products.unit_linked.reserves", "avk.products.unit_linked.profit", "avk.products.unit_linked.capital", "avk.products.unit_linked.mcev", "avk.products.rider.critical_illness", "avk.products.rider.disability", "avk.products.common.*", "avk.generated.*"]
ignore_errors = true

[tool.importlinter]
root_package = "avk"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Numerical core is independent"
type = "forbidden"
source_modules = ["avk.model"]
forbidden_modules = ["avk.products","avk.inputs","avk.assumptions","avk.esg","avk.outputs","avk.runs","avk.runtime","avk.api","avk.cli","avk.ui","avk.testing","polars","pandas","pydantic","sqlalchemy","streamlit","plotly","yaml"]

[[tool.importlinter.contracts]]
name = "products dependency boundary"
type = "forbidden"
source_modules = ["avk.products"]
forbidden_modules = ["avk.esg","avk.runs","avk.api","avk.cli","avk.ui","avk.testing"]
allow_indirect_imports = true

